# --- Datasource ---
# No defaults on purpose: if a variable is missing, startup fails
# ("Could not resolve placeholder") instead of connecting to the wrong place.
spring.datasource.url=jdbc:postgresql://${DATASOURCE_HOST}:${DATASOURCE_PORT}/${DATASOURCE_NAME}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# --- Logs: enough for monitoring, without debug noise ---
logging.level.eu.bylucas=INFO

# --- Actuator: minimal exposure ---
# health is used by the CD to check the deployment.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
