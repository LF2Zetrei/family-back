spring.application.name=family-recipes

# --- JPA / Flyway ---
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The datasource is defined per profile:
#  - application-dev.properties  : with local defaults
#  - application-prod.properties : no defaults, startup fails if a variable is missing
