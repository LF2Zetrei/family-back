spring.application.name=family-recipes

# --- Datasource ---
# Values come from environment variables (see .env / .env.example).
# Defaults target the dockerized Postgres from the host machine (port 5434),
# so `./mvnw spring-boot:run` works too once the db container is up.
spring.datasource.url=jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5434}/${DATASOURCE_NAME:family_recipes}
spring.datasource.username=${DATASOURCE_USERNAME:family}
spring.datasource.password=${DATASOURCE_PASSWORD}

# --- JPA / Flyway ---
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
