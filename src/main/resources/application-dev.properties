# --- Datasource ---
# Defaults target the dockerized Postgres from the host machine (port 5434).
# Inside docker compose, the .env values (db:5432) override them.
# No default for the password: it must never be committed.
spring.datasource.url=jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5434}/${DATASOURCE_NAME:family_recipes}
spring.datasource.username=${DATASOURCE_USERNAME:family}
spring.datasource.password=${DATASOURCE_PASSWORD}

# --- Debugging ---
spring.jpa.show-sql=true
logging.level.eu.bylucas=DEBUG

# --- Actuator: everything visible, for exploring ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
